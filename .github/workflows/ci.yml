name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: perl-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: perl-api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run audit:check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: perl-rfid-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: perl-rfid-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

