services:
  perl-api:
    build:
      context: ./perl-api
      dockerfile: Dockerfile
    container_name: perl-api
    environment:
      PORT: 4000
      DATA_LAYER: mock
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "4000:4000"

  perl-rfid-frontend:
    build:
      context: ./perl-rfid-frontend
      dockerfile: Dockerfile
    container_name: perl-rfid-frontend
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - perl-api
